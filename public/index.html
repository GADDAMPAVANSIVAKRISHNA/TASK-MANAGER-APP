<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="toast"></div>
    <section id="auth" class="auth-shell hidden">
      <div class="auth-card">
        <div class="brand-row">
          <div class="logo">T</div>
          <div>
            <h1>Task Manager</h1>
            <p>Team projects, tasks, and progress in one calm workspace.</p>
          </div>
        </div>
        <div class="auth-tabs">
          <button id="login-tab" class="active">Login</button>
          <button id="signup-tab">Signup</button>
        </div>
        <form id="login-form" class="form">
          <div class="role-login-grid">
            <button type="button" class="role-login-card active" data-starter-login="admin">
              <strong>Admin Login</strong>
              <span>Full project, task, and team controls</span>
            </button>
            <button type="button" class="role-login-card" data-starter-login="member">
              <strong>Member Login</strong>
              <span>Assigned tasks and personal status updates</span>
            </button>
          </div>
          <label>Email<input name="email" type="email" value="admin@taskflow.test" required></label>
          <label>Password<input name="password" type="password" value="admin123" required></label>
          <button class="primary-btn" type="submit">Sign In</button>
          <p class="hint">Use the starter role buttons above, or create your own Admin/Member account from Signup.</p>
        </form>
        <form id="signup-form" class="form hidden">
          <label>Full Name<input name="full_name" required></label>
          <label>Email<input name="email" type="email" required></label>
          <label>Password<input name="password" type="password" minlength="6" required></label>
          <label>Account Role<select name="role"><option value="admin">Admin</option><option value="user" selected>Member</option></select></label>
          <button class="primary-btn" type="submit">Create Account</button>
          <p class="hint">Choose Admin if you need project, task, and team management. Choose Member for assigned-task access.</p>
        </form>
      </div>
    </section>
    <section id="app" class="app-shell hidden">
      <aside id="sidebar" class="sidebar">
        <div class="side-top">
          <a href="/" class="brand"><span class="logo">T</span><span>Task Manager</span></a>
          <nav id="nav"></nav>
        </div>
      </aside>
      <div id="scrim" class="scrim"></div>
      <main class="main">
        <header class="topbar">
          <button id="menu" class="icon-btn mobile-only">☰</button>
          <div></div>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span id="theme-label">Light</span>
          </button>
          <span id="top-name" class="top-name"></span>
          <div class="account-menu">
            <button id="account-button" class="avatar avatar-button" type="button" aria-label="Open account menu">A</button>
            <div id="account-dropdown" class="account-dropdown hidden">
              <div class="account-summary">
                <div class="avatar" id="menu-avatar">A</div>
                <div>
                  <strong id="menu-name">User</strong>
                  <span id="menu-role">Member</span>
                </div>
              </div>
              <div class="account-email" id="menu-email"></div>
              <button class="menu-action" type="button" data-edit-profile>Edit Profile</button>
              <button class="menu-action danger-text" type="button" data-logout>Sign Out</button>
            </div>
          </div>
        </header>
        <div id="view" class="view"></div>
      </main>
    </section>

    <dialog id="modal">
      <div id="modal-body"></div>
    </dialog>
    <script src="/app.js"></script>
  </body>
</html>
